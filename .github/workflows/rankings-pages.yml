name: Rankings snapshot & Pages

on:
  schedule:
    # 每 10 分钟采样一次，错开整点。
    - cron: "2-52/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "monitor/**"
      - "scripts/**"
      - ".github/workflows/rankings-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rankings-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"

      - name: Capture current rankings
        if: github.event_name != 'push'
        run: |
          python -m pip install --disable-pip-version-check requests
          python scripts/build_snapshot.py --out "$RUNNER_TEMP/snapshot.json"

      - name: Build static site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p _site
          cp docs/index.html docs/style.css docs/app.js docs/config.js docs/snapshot-client.js docs/favicon.svg _site/
          cp docs/score-replay.js _site/
          inputs=(docs/score-peaks.json)
          previous="$RUNNER_TEMP/previous-score-peaks.json"
          status=$(curl --silent --show-error --location --retry 2 --max-time 30 \
            --header 'Cache-Control: no-cache' --output "$previous" --write-out '%{http_code}' \
            "${PAGES_BASE_URL%/}/score-peaks.json?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          case "$status" in
            200) inputs+=("$previous") ;;
            404) echo "No published score archive yet; using the repository seed." ;;
            *) echo "::error::Could not read the published archive (HTTP $status)"; exit 1 ;;
          esac
          if [[ "$GITHUB_EVENT_NAME" != 'push' ]]; then
            inputs+=("$RUNNER_TEMP/snapshot.json")
          fi
          node scripts/build_score_peaks.mjs _site/score-peaks.json "${inputs[@]}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Send snapshot to Worker if configured
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
        run: |
          if [[ -z "$COLLECTOR_SECRET" ]]; then
            echo "Worker collection is unconfigured; the shared Pages archive is still published."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 2 --max-time 30 \
            --header "Authorization: Bearer $COLLECTOR_SECRET" --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/snapshot.json" \
            https://cannjudge-rankings-proxy.cannjudge-rankings-proxy.workers.dev/record

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
