name: Rankings snapshot & Pages

on:
  schedule:
    # GitHub Actions 的最短计划间隔为 5 分钟；错开整点，减少被队列延迟/丢弃的概率
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/rankings-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rankings-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p _site
          cp docs/index.html docs/style.css docs/app.js docs/config.js docs/snapshot-client.js docs/favicon.svg _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and store a rankings snapshot
        env:
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
        run: |
          : "${COLLECTOR_SECRET:?Set COLLECTOR_SECRET in repository Actions secrets}"
          python -m pip install --disable-pip-version-check requests
          python scripts/build_snapshot.py --out "$RUNNER_TEMP/snapshot.json"
          curl --fail-with-body --silent --show-error --retry 2 --max-time 30 \
            --header "Authorization: Bearer $COLLECTOR_SECRET" --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/snapshot.json" \
            https://cannjudge-rankings-proxy.cannjudge-rankings-proxy.workers.dev/record
